<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>واتساب اليازان</title>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#111b21;height:100vh;display:flex;overflow:hidden}
#app{display:flex;width:100%;height:100%}
/* SIDEBAR */
#sidebar{width:35%;min-width:300px;background:#111b21;border-left:1px solid #222d34;display:flex;flex-direction:column}
#side-header{background:#202c33;padding:12px 15px;display:flex;justify-content:space-between;align-items:center}
#side-header h2{color:#e9edef;font-size:19px} #side-header span{color:#aebac1;font-size:13px}
#search{background:#111b21;padding:8px 12px} #search input{width:100%;background:#202c33;border:none;padding:9px 15px;border-radius:8px;color:#fff;outline:none;font-size:14px}
#chats{flex:1;overflow-y:auto}
.chat-item{display:flex;gap:12px;padding:12px 15px;cursor:pointer;border-bottom:1px solid #222d34}
.chat-item:hover{background:#202c33}.chat-item.active{background:#2a3942}
.chat-item.avatar{width:49px;height:49px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:20px}
.chat-item.info{flex:1}.chat-item.info b{color:#e9edef;font-size:16px}.chat-item.info p{color:#8696a0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chat-item.time{color:#8696a0;font-size:11px}
/* MAIN CHAT */
#main{flex:1;display:flex;flex-direction:column;background:#0b141a url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');position:relative}
#main-header{background:#202c33;padding:10px 15px;display:flex;align-items:center;gap:12px}
#main-header.avatar{width:40px;height:40px;background:#00a884;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
#main-header b{color:#e9edef} #main-header span{color:#8696a0;font-size:13px;display:block}
#messages{flex:1;padding:20px 5% 20px 5%;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:65%;padding:6px 8px 6px 10px;border-radius:8px;position:relative;font-size:14.5px;line-height:1.3;box-shadow:0 1px.5px rgba(0,0,0,.13)}
.bubble.me{background:#005c4b;color:#e9edef;margin-right:auto;border-top-right-radius:0}
.bubble.other{background:#202c33;color:#e9edef;margin-left:auto;border-top-left-radius:0}
.bubble.meta{font-size:10.5px;color:#8696a0;display:flex;gap:4px;justify-content:flex-end;margin-top:4px;align-items:center}
.bubble.me.meta{color:#53bdeb}.ticks{color:#53bdeb;font-size:12px}
#sendBar{background:#202c33;padding:8px 15px;display:flex;align-items:center;gap:10px}
#sendBar input{flex:1;background:#2a3942;border:none;padding:11px 15px;border-radius:8px;color:#fff;outline:none;font-size:15px}
#sendBar button{background:#00a884;border:none;width:45px;height:45px;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#login{position:fixed;inset:0;background:#111b21;z-index:999;display:flex;align-items:center;justify-content:center}
#loginBox{background:#202c33;padding:35px 25px;border-radius:12px;width:92%;max-width:380px;text-align:center}
#loginBox h1{color:#e9edef;margin-bottom:8px} #loginBox p{color:#8696a0;margin-bottom:20px;font-size:14px}
#loginBox input{width:100%;padding:14px;background:#2a3942;border:1px solid #00a884;border-radius:8px;color:#fff;text-align:center;font-size:16px;outline:none;margin-bottom:15px}
#loginBox button{width:100%;padding:13px;background:#00a884;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
#typing{height:18px;color:#00a884;font-size:12px;padding:0 20px}
@media(max-width:768px){#sidebar{display:none} #sidebar.show{position:absolute;inset:0;width:100%;z-index:5;display:flex}}
</style>
</head>
<body>
<div id="login"><div id="loginBox">
<h1>💬 واتساب اليازان</h1><p>واتساب حقيقي 100% يتحمل 100 شخص</p>
<input id="nameIn" placeholder="اكتب اسمك..." maxlength="15">
<button onclick="join()">دخول الواتساب ✅</button>
</div></div>

<div id="app">
<div id="sidebar" class="show">
<div id="side-header"><div><h2>الدردشات</h2><span id="online">● متصل الآن: 1</span></div><span style="font-size:22px">⋮</span></div>
<div id="search"><input placeholder="🔍 بحث أو بدء دردشة جديدة"></div>
<div id="chats"></div>
</div>

<div id="main">
<div id="main-header"><div class="avatar" id="mainAvatar">Y</div><div><b id="mainName">عالم اليازان V14</b><span id="status">متصل الآن • واتساب متكامل</span></div></div>
<div id="typing"></div>
<div id="messages"></div>
<div id="sendBar"><input id="msgIn" placeholder="اكتب رسالة" oninput="typing()" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">➤</button></div>
</div>
</div>

<script>
let socket,myName,myColor='#00a884'; const colors=['#00a884','#ffbc38','#ff4a4a','#3b82f6','#a78bfa','#ec4899'];
myColor=colors[Math.floor(Math.random()*colors.length)];
const msgsDiv=document.getElementById('messages'), chatsDiv=document.getElementById('chats');
function join(){
 myName=document.getElementById('nameIn').value.trim(); if(!myName) return alert('اكتب اسمك!');
 document.getElementById('login').style.display='none'; document.getElementById('mainAvatar').textContent=myName[0].toUpperCase();
 socket=io(); socket.emit('join',{name:myName,color:myColor});
 socket.on('history',arr=>{arr.forEach(addMsg); updateChats(arr);});
 socket.on('message',d=>{addMsg(d); updateChats([d]);});
 socket.on('count',c=>document.getElementById('online').textContent='● متصل الآن: '+c);
 socket.on('typing',d=>{if(d.name!==myName){document.getElementById('status').textContent=d.name+' يكتب...'; document.getElementById('typing').textContent=d.name+' يكتب...'; setTimeout(()=>{document.getElementById('status').textContent='متصل الآن • واتساب متكامل'; document.getElementById('typing').textContent=''},2000)}});
}
function addMsg(d){
 const isMe=d.name===myName;
 const div=document.createElement('div'); div.className='bubble '+(isMe?'me':'other');
 const time=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
 div.innerHTML=`${!isMe?`<div style="color:${d.color};font-weight:bold;font-size:13px;margin-bottom:2px">${d.name}</div>`:''}${d.text}<div class="meta">${time} ${isMe?'<span class="ticks">✓✓</span>':''}</div>`;
 msgsDiv.appendChild(div); msgsDiv.scrollTop=99999;
}
function updateChats(arr){
 chatsDiv.innerHTML='';
 const last=arr[arr.length-1]; if(!last) return;
 const div=document.createElement('div'); div.className='chat-item active';
 div.innerHTML=`<div class="avatar" style="background:${last.color}">${last.name[0]}</div><div class="info"><b>${last.name}</b><p>${last.text}</p></div><div class="time">${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div>`;
 chatsDiv.appendChild(div);
}
function send(){
 const inp=document.getElementById('msgIn'); if(!inp.value.trim()) return;
 const data={name:myName,color:myColor,text:inp.value}; socket.emit('message',data); inp.value='';
}
function typing(){ socket.emit('typing',{name:myName}); }
</script>
</body>
</html>
